[pytest]
testpaths = src/glyphs-mcp/tests
# LangSmith's globally auto-loaded plug-in imports Pydantic before the isolated
# FastMCP compatibility tests and can leave its module cache inconsistent.
# Glyphs MCP does not use that plug-in, so direct pytest runs disable it.
addopts = -p no:langsmith_plugin -p scripts.pytest_readable_report --readable-report --test-report=build/test-report.md
markers =
    integration: external processes, persistent integration, or real threaded orchestration
    stress: large capacity or expensive geometry qualification
    dependency: fresh supported-Python dependency installation matrix
    performance: functional liveness checks with optional strict latency gates

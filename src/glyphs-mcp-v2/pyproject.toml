[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphs-mcp-v2"
version = "2.0.0"
description = "Typed Glyphs MCP 2.0 runtime foundation"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastmcp==2.12.0",
  "openstep_plist==0.5.2",
  "typing_extensions>=4.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["glyphs_mcp_v2*"]

[tool.setuptools.package-data]
glyphs_mcp_v2 = ["knowledge_data/*.json"]

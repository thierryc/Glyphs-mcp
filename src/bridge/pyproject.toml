[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphs-mcp-bridge"
version = "0.1.0"
description = "Small in-Glyphs bridge for the standalone Glyphs MCP sidecar"
requires-python = ">=3.11,<3.15"
dependencies = ["glyphs-mcp-protocol==0.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["glyphs_mcp_bridge*"]
